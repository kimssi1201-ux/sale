<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>픽앤세일 | 6월 추천 상품 큐레이션</title>
    <meta
      name="description"
      content="6월 장마, 더위, 습기 대비 상품을 빠르게 비교하고 쿠팡 상품 페이지로 이동할 수 있는 쇼핑 큐레이션 화면입니다."
    />
    <link rel="stylesheet" href="./styles.css?v=notice-center-20260609" />
    <link rel="stylesheet" href="./manual.css?v=top-categories-grid-20260609" />
    <style>
      :root {
        --notice-bar-height: 42px;
      }

      .notice-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px 14px;
        width: 100%;
        min-height: var(--notice-bar-height);
        padding: 8px 24px;
        text-align: center;
        background: #fff4d6;
        box-shadow: 0 4px 14px rgba(23, 27, 34, 0.06);
      }

      .notice-bar span {
        text-align: center;
      }

      .site-header {
        top: var(--notice-bar-height);
      }

      .mobile-tabs {
        display: none !important;
      }

      .content-layout .section-head {
        display: flex;
      }

      .search-status {
        min-height: 22px;
        margin: -2px 0 0;
        color: #68707b;
        font-size: 14px;
        font-weight: 800;
      }

      .search-status[data-tone="success"] {
        color: #075e58;
      }

      .search-status[data-tone="error"] {
        color: #bd3e28;
      }

      .fixed-picks {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto 18px;
        padding: 16px;
        border: 1px solid #ead58f;
        border-radius: 8px;
        background: #fff8d8;
      }

      .fixed-picks-head {
        margin-bottom: 12px;
      }

      .fixed-picks-head strong,
      .fixed-picks-head span {
        display: block;
      }

      .fixed-picks-head strong {
        color: #7a460e;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 950;
      }

      .fixed-picks-head span {
        margin-top: 3px;
        color: #6f5a2d;
        font-size: 15px;
        font-weight: 800;
      }

      .fixed-picks-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .fixed-pick-card {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 112px;
        padding: 10px;
        border: 1px solid #ead58f;
        border-radius: 8px;
        background: #fff;
      }

      .fixed-pick-card:hover {
        border-color: #d49a22;
        box-shadow: 0 10px 24px rgba(122, 70, 14, 0.12);
      }

      .fixed-pick-image {
        display: grid;
        place-items: center;
        width: 86px;
        height: 86px;
        border-radius: 8px;
        background: #fffdf3;
      }

      .fixed-pick-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 6px;
      }

      .fixed-pick-copy {
        display: grid;
        gap: 5px;
        min-width: 0;
      }

      .fixed-pick-badge {
        display: inline-flex;
        width: fit-content;
        min-height: 24px;
        align-items: center;
        border-radius: 8px;
        padding: 0 8px;
        color: #7a460e;
        background: #fff2b6;
        font-size: 13px;
        font-weight: 900;
      }

      .fixed-pick-copy strong {
        display: -webkit-box;
        overflow: hidden;
        color: #171b22;
        font-size: 16px;
        line-height: 1.32;
        font-weight: 950;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow-wrap: anywhere;
      }

      .fixed-pick-price {
        color: #bd3e28;
        font-size: 18px;
        line-height: 1.15;
        font-weight: 950;
      }

      @media (max-width: 980px) {
        .notice-extra {
          display: none;
        }

        .fixed-picks-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 720px) {
        :root {
          --notice-bar-height: 72px;
        }

        .notice-bar {
          padding: 7px 12px;
          font-size: 12.5px;
          line-height: 1.35;
          text-align: center;
        }

        .notice-extra {
          display: none;
        }

        .fixed-picks {
          width: calc(100% - 24px);
          padding: 12px;
        }

        .fixed-picks-head strong {
          font-size: 20px;
        }

        .fixed-picks-head span {
          font-size: 13.5px;
          line-height: 1.45;
        }

        .fixed-picks-grid {
          gap: 8px;
        }

        .fixed-pick-card {
          grid-template-columns: 1fr;
          align-content: start;
          min-height: 190px;
          gap: 8px;
        }

        .fixed-pick-image {
          width: 100%;
          height: 104px;
        }

        .fixed-pick-copy strong {
          min-height: 42px;
          font-size: 15px;
        }

        .fixed-pick-price {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <section class="notice-bar" id="notice" aria-label="파트너스 고지">
      <strong>파트너스 고지</strong>
      <span>쿠팡 파트너스 활동을 통해 일정액의 수수료를 제공받을 수 있습니다.</span>
      <span class="notice-extra">가격, 쿠폰, 배송 조건은 쿠팡 상품 페이지에서 최종 확인하세요.</span>
    </section>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="픽앤세일 홈">
        <span class="brand-mark">P</span>
        <span class="brand-copy">
          <strong>픽앤세일</strong>
          <small>6월 추천 상품 큐레이션</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="#products">상품</a>
        <a href="#notice">고지</a>
      </nav>

      <a class="header-cta" href="#products">상품 보기</a>
    </header>

    <main id="top">
      <section class="shop-toolbar" aria-label="상품 검색과 카테고리">
        <div class="search-box">
          <label for="search">상품 검색</label>
          <input id="search" type="search" placeholder="제습기, 냉감패드, 선풍기" autocomplete="off" />
          <p id="searchStatus" class="search-status" hidden></p>
        </div>

        <div class="sort-box">
          <label for="sort">정렬</label>
          <select id="sort">
            <option value="latest">최신순</option>
            <option value="price-low">낮은 가격순</option>
            <option value="discount-high">높은 할인율순</option>
            <option value="review-high">상품평 많은순</option>
          </select>
        </div>

        <div class="category-tabs" id="categoryTabs" aria-label="카테고리 선택">
          <button class="category-tab is-active" type="button" data-category="전체">전체</button>
        </div>
      </section>

      <section class="fixed-picks" aria-label="6월 추천제품">
        <div class="fixed-picks-head">
          <div>
            <strong>6월 추천제품</strong>
            <span>비 오기 전에, 더워지기 전에 먼저 챙기세요. 6월에 많이 찾는 여름 준비템만 골랐습니다.</span>
          </div>
        </div>
        <div id="fixedPicksGrid" class="fixed-picks-grid"></div>
      </section>

      <section class="content-layout" id="products" aria-label="검색 결과와 추천 상품 목록">
        <section class="product-area" aria-label="상품 카드">
          <div class="section-head">
            <div>
              <p class="kicker" id="productKicker">검색 결과</p>
              <h2 id="productTitle">추천 상품</h2>
            </div>
            <span id="resultCount" class="result-count">0개</span>
          </div>

          <div id="productGrid" class="product-grid" aria-live="polite"></div>
          <div class="catalog-actions">
            <button class="load-more" id="loadMore" type="button" hidden>더보기</button>
          </div>
        </section>
      </section>
    </main>

    <template id="productTemplate">
      <article class="product-card">
        <a class="product-media" href="#" target="_blank" rel="nofollow sponsored noopener">
          <span class="product-badge"></span>
          <img class="product-photo" src="" alt="" loading="eager" />
        </a>
        <div class="product-content">
          <div class="product-meta">
            <span class="product-category"></span>
            <span class="product-review"></span>
          </div>
          <h3></h3>
          <p class="product-summary"></p>
          <ul class="benefit-list"></ul>
          <div class="card-bottom">
            <div class="price-board card-price-board" aria-label="상품 가격 정보">
              <div>
                <span>정가</span>
                <strong class="card-original-price-value"></strong>
              </div>
              <div>
                <span class="card-discount-label"></span>
                <strong class="card-discount-value"></strong>
              </div>
              <div>
                <span>할인가</span>
                <strong class="card-sale-price-value sale-price-value"></strong>
              </div>
              <div>
                <span class="card-review-label"></span>
                <strong class="card-review-value"></strong>
              </div>
            </div>
            <a class="buy-link" href="#" target="_blank" rel="nofollow sponsored noopener">쿠팡에서 보기</a>
          </div>
        </div>
      </article>
    </template>

  <script src="./app.js?v=june-20-search-only-20260609"></script>
  </body>
</html>
